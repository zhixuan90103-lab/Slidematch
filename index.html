<!DOCTYPE html>
<!--
  SlideMatch entry.
  DOM: #shell > #viewport > #app > #stage > (canvas | #ui-root)
  See AGENTS.md
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <title>SlideMatch</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="shell">
      <div id="viewport">
        <div id="app">
          <div id="stage" aria-label="game-stage">
            <div id="ui-root">
              <div id="hud">
                <div class="hud-coins hud-panel" id="hud-coins-wrap" aria-label="本局金币">
                  <p class="hud-label">COINS</p>
                  <div class="hud-coins-row">
                    <span class="hud-coins-icon" aria-hidden="true"></span>
                    <span id="hud-coins" class="hud-coins-n">0</span>
                  </div>
                </div>
                <div class="hud-score-wrap hud-panel">
                  <p class="hud-label">SCORE</p>
                  <p id="hud-score" class="hud-score">0</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="device-switcher" aria-label="device-viewport-switcher">
      <button type="button" data-device="phone">手机竖屏</button>
      <button type="button" data-device="pad">Pad 竖屏</button>
    </div>
    <div id="device-label"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
